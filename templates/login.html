{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 60px auto;">
    <h1 style="text-align: center;">PH.D <span style="color: var(--phd-green);">SPORTS</span></h1>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 20px;">Sistema de Avaliação Física</p>
    <form method="POST">
        <div class="form-group">
            <label>Usuário</label>
            <input type="text" name="username" placeholder="admin" required>
        </div>
        <div class="form-group">
            <label>Senha</label>
            <input type="password" name="password" placeholder="••••••" required>
        </div>
        <button type="submit" class="btn btn-block">Entrar</button>
    </form>
</div>
{% endblock %}
